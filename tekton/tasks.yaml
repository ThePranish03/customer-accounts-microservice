apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: python-quality
spec:
  workspaces:
    - name: source
  steps:
    - name: lint-and-test
      image: python:3.12-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        pip install -r requirements.txt
        flake8 service.py tests
        nosetests -v
