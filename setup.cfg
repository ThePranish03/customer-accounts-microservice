[coverage:run]
branch = True
source = service
omit =
    tests/*
    .venv/*
    venv/*

[coverage:report]
show_missing = True
skip_covered = False
fail_under = 75
precision = 2
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:

[pylint]
py-version = 3.11
good-names = app, db, id, _
max-line-length = 100
disable = C0114,C0115,C0116,R0903

[flake8]
max-line-length = 100
exclude = .git,.venv,venv,__pycache__,build,dist
extend-ignore = E203,W503
per-file-ignores =
    tests/*: S101

[nosetests]
verbosity = 2
with-spec = 0
with-coverage = 1
cover-package = service
cover-erase = 1
cover-branches = 1
cover-inclusive = 1
detailed-errors = 1
stop = 1
